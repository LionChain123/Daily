name: Build DailyGrowth iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DailyGrowth/**'
      - 'DailyGrowth.xcodeproj/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/build-iphone.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify models and build unsigned device app
        run: bash scripts/build-iphone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DailyGrowth-iPhone-IPA
          path: artifacts/DailyGrowth-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DailyGrowth-build-logs
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
